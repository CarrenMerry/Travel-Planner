<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Travel Plans — Wayfarer</title>
  <meta name="description" content="View and manage your custom travel itineraries, budget tracking, and ordered stops.">
  <link rel="stylesheet" href="css/wayfarer-clean.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300A6B2'><path d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z'/></svg>">
</head>
<body>
  <header class="navbar" id="mainNav"></header>

  <main class="main-wrapper">
    <div class="page-header-row">
      <div>
        <span class="badge badge-accent" style="margin-bottom: 0.5rem;">Trip Management</span>
        <h1 class="page-title">My Travel Plans</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Organize your custom journeys, manage sequential stops, and track travel budgets.</p>
      </div>
      <button id="openNewItineraryBtn" class="btn btn-primary btn-lg">+ Create New Trip</button>
    </div>

    <!-- Itineraries Grid View -->
    <div class="grid-3" id="itinerariesGrid" style="margin-bottom: 3rem;">
      <div style="grid-column: 1 / -1; text-align: center; color: var(--color-text-muted); padding: 4rem;">
        Loading your travel itineraries...
      </div>
    </div>
  </main>

  <!-- Create Itinerary Modal -->
  <div class="modal-backdrop" id="itineraryModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Create New Itinerary</h3>
        <button class="btn-close" id="closeItineraryModalBtn">&times;</button>
      </div>
      <form id="itineraryForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="itineraryName">Trip Name</label>
            <input type="text" id="itineraryName" class="form-control" placeholder="e.g. Grand Autumn Tour, Mediterranean Coast" required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label" for="itineraryBudget">Target Budget ($ USD)</label>
            <input type="number" id="itineraryBudget" class="form-control" placeholder="3000" min="0" step="50" required>
            <div style="font-size: 0.8rem; color: var(--color-text-muted); margin-top: 0.35rem;">You can update or adjust this budget at any time during planning.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelItineraryBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveItineraryBtn">Create Trip &amp; Open Builder</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer"></footer>

  <script src="js/wayfarer-api.js"></script>
  <script src="js/wayfarer-ui.js"></script>
  <script>
    let userItineraries = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await WayfarerUI.requireLogin();
      if (!user) return;

      await WayfarerUI.initNavbar('itineraries');
      WayfarerUI.initFooter();

      loadItineraries();
      initModal();
    });

    async function loadItineraries() {
      const grid = document.getElementById('itinerariesGrid');
      try {
        const list = await WayfarerAPI.getUserItineraries();
        userItineraries = Array.isArray(list) ? list : [];

        if (userItineraries.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1;" class="empty-state">
              <div class="empty-state-icon">🗺️</div>
              <div class="empty-state-title">No itineraries found</div>
              <p class="empty-state-desc">You haven't planned any journeys yet. Start creating your first trip and organize stops with our custom Linked List.</p>
              <button class="btn btn-primary btn-lg" onclick="document.getElementById('openNewItineraryBtn').click()">+ Create Your First Itinerary</button>
            </div>
          `;
          return;
        }

        grid.innerHTML = userItineraries.map(it => {
          const count = it.stops ? it.stops.length : 0;
          const isOverBudget = it.budget > 0 && it.totalEstimatedCost > it.budget;
          const budgetPct = it.budget > 0 ? Math.min(100, Math.round((it.totalEstimatedCost / it.budget) * 100)) : 0;
          const status = it.status || 'DRAFT';

          return `
            <div class="card card-hover" style="display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                  <span class="badge ${status === 'CONFIRMED' ? 'badge-success' : 'badge-neutral'}">${status}</span>
                  <span style="font-size: 0.8rem; color: var(--color-text-muted);">Trip #${it.id}</span>
                </div>

                <h3 class="title-serif" style="font-size: 1.35rem; margin-bottom: 0.45rem;">
                  ${WayfarerUI.escape(it.name || 'Untitled Trip')}
                </h3>
                <div style="font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: 1.25rem;">
                  Created: ${it.createdAt ? it.createdAt.substring(0, 10) : 'Recent'}
                </div>

                <!-- Metrics Grid -->
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.85rem; background: var(--bg-card-subtle); padding: 0.95rem; border-radius: var(--radius-md); margin-bottom: 1.25rem;">
                  <div>
                    <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-text-muted); font-weight: 600;">Ordered Stops</div>
                    <div style="font-size: 1.2rem; font-weight: 700; color: var(--color-primary);">${count} stop${count === 1 ? '' : 's'}</div>
                  </div>
                  <div>
                    <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-text-muted); font-weight: 600;">Duration</div>
                    <div style="font-size: 1.2rem; font-weight: 700; color: var(--color-primary);">${it.totalDurationDays || 0} days</div>
                  </div>
                </div>

                <!-- Budget Bar -->
                <div style="margin-bottom: 1.5rem;">
                  <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.35rem;">
                    <span style="color: var(--color-text-muted);">Budget: <strong>${WayfarerUI.formatMoney(it.budget)}</strong></span>
                    <span style="font-weight: 700; color: ${isOverBudget ? 'var(--color-danger)' : 'var(--color-primary)'};">
                      Cost: ${WayfarerUI.formatMoney(it.totalEstimatedCost)}
                    </span>
                  </div>
                  <div style="width: 100%; height: 6px; background: var(--color-border); border-radius: 3px; overflow: hidden;">
                    <div style="width: ${budgetPct}%; height: 100%; background: ${isOverBudget ? 'var(--color-danger)' : 'var(--color-primary)'}; transition: width 0.3s ease;"></div>
                  </div>
                  ${isOverBudget ? '<div style="font-size: 0.75rem; color: var(--color-danger); font-weight: 600; margin-top: 0.25rem;">⚠️ Exceeds targeted budget</div>' : ''}
                </div>
              </div>

              <!-- Card Action Footer -->
              <div style="display: flex; gap: 0.5rem; justify-content: space-between; align-items: center; border-top: 1px solid var(--color-border); padding-top: 1rem; margin-top: auto;">
                <button class="btn btn-secondary btn-sm" onclick="deleteItinerary(${it.id})" title="Delete Itinerary" style="color: var(--color-danger);">
                  Delete
                </button>
                <a href="itinerary-builder.html?id=${it.id}" class="btn btn-primary btn-sm">
                  Open Builder &rarr;
                </a>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1;" class="alert alert-danger">
            Could not load itineraries: ${WayfarerUI.escape(err.message)}
          </div>
        `;
      }
    }

    function initModal() {
      const modal = document.getElementById('itineraryModal');
      const openBtn = document.getElementById('openNewItineraryBtn');
      const closeBtn = document.getElementById('closeItineraryModalBtn');
      const cancelBtn = document.getElementById('cancelItineraryBtn');
      const form = document.getElementById('itineraryForm');

      const openModal = () => modal.classList.add('active');
      const closeModal = () => modal.classList.remove('active');

      openBtn.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);
      cancelBtn.addEventListener('click', closeModal);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('itineraryName').value.trim();
        const budget = parseFloat(document.getElementById('itineraryBudget').value) || 0;
        const btn = document.getElementById('saveItineraryBtn');

        btn.disabled = true;
        btn.textContent = 'Creating Trip...';

        try {
          const res = await WayfarerAPI.createItinerary(name, budget);
          if (res && res.id) {
            closeModal();
            window.location.href = `itinerary-builder.html?id=${res.id}`;
          } else {
            alert('Could not create itinerary.');
          }
        } catch (err) {
          alert('Error: ' + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Create Trip & Open Builder';
        }
      });
    }

    window.deleteItinerary = async function(id) {
      const it = userItineraries.find(x => x.id === id);
      const name = it ? (it.name || 'Untitled Trip') : 'this itinerary';
      if (!confirm(`Are you sure you want to delete "${name}"? This action cannot be undone.`)) {
        return;
      }

      try {
        const res = await WayfarerAPI.deleteItinerary(id);
        if (res && res.success) {
          loadItineraries();
        } else {
          alert(res.message || 'Failed to delete itinerary.');
        }
      } catch (err) {
        alert('Delete error: ' + err.message);
      }
    };
  </script>
</body>
</html>
